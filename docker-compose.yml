services:
  postgres-hotel:
    image: docker-mirror.liara.ir/postgres:latest
    container_name: hotel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_hotel_data:/var/lib/postgresql
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

volumes:
  postgres_hotel_data:
